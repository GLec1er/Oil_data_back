<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">North-07 simulated telemetry chart</title>
  <desc id="desc">A 24-hour normalized sample trend for pressure, flow rate, and water cut.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12242b"/>
      <stop offset="1" stop-color="#0b151d"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b860" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a6d6cc" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="21" fill="url(#grid)" stroke="#a6d6cc" stroke-opacity=".2"/>
  <text x="50" y="49" fill="#f4b860" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">SIGNAL PREVIEW / SIMULATED</text>
  <text x="50" y="87" fill="#e8f0eb" font-family="Georgia, serif" font-size="30">NORTH-07 / 24-hour telemetry</text>
  <text x="1150" y="49" text-anchor="end" fill="#91a39f" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.3">NORMALIZED FOR COMPARISON</text>

  <g font-family="Arial, sans-serif" font-size="10">
    <line x1="716" y1="47" x2="744" y2="47" stroke="#f4b860" stroke-width="3" stroke-linecap="round"/>
    <text x="753" y="51" fill="#e8f0eb">pressure</text>
    <line x1="830" y1="47" x2="858" y2="47" stroke="#7dd3c0" stroke-width="3" stroke-linecap="round"/>
    <text x="867" y="51" fill="#e8f0eb">flow rate</text>
    <line x1="960" y1="47" x2="988" y2="47" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <text x="997" y="51" fill="#e8f0eb">water cut</text>
  </g>

  <rect x="70" y="125" width="1080" height="276" rx="10" fill="#0a141b" fill-opacity=".52" stroke="#a6d6cc" stroke-opacity=".13"/>
  <g stroke="#a6d6cc" stroke-opacity=".14" stroke-dasharray="3 7">
    <line x1="70" y1="125" x2="1150" y2="125"/><line x1="70" y1="194" x2="1150" y2="194"/><line x1="70" y1="263" x2="1150" y2="263"/><line x1="70" y1="332" x2="1150" y2="332"/><line x1="70" y1="401" x2="1150" y2="401"/>
    <line x1="70" y1="125" x2="70" y2="401"/><line x1="250" y1="125" x2="250" y2="401"/><line x1="430" y1="125" x2="430" y2="401"/><line x1="610" y1="125" x2="610" y2="401"/><line x1="790" y1="125" x2="790" y2="401"/><line x1="970" y1="125" x2="970" y2="401"/><line x1="1150" y1="125" x2="1150" y2="401"/>
  </g>
  <g fill="#5c716e" font-family="Arial, sans-serif" font-size="10" text-anchor="end">
    <text x="58" y="129">100</text><text x="58" y="198">75</text><text x="58" y="267">50</text><text x="58" y="336">25</text><text x="58" y="405">0</text>
  </g>
  <text x="70" y="115" fill="#91a39f" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.2">NORMALIZED SIGNAL</text>

  <path d="M70 318 C120 306 155 315 190 284 S270 279 310 261 S385 245 430 254 S505 228 550 220 S630 191 670 211 S740 198 790 174 S870 165 910 182 S985 135 1030 153 S1100 141 1150 126 L1150 401 L70 401 Z" fill="url(#fill)"/>
  <path d="M70 318 C120 306 155 315 190 284 S270 279 310 261 S385 245 430 254 S505 228 550 220 S630 191 670 211 S740 198 790 174 S870 165 910 182 S985 135 1030 153 S1100 141 1150 126" fill="none" stroke="#f4b860" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M70 351 C120 342 155 349 190 328 S270 312 310 327 S385 292 430 306 S505 279 550 292 S630 254 670 277 S740 241 790 259 S870 231 910 247 S985 205 1030 227 S1100 198 1150 210" fill="none" stroke="#7dd3c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 270 C120 275 155 265 190 279 S270 261 310 270 S385 245 430 258 S505 235 550 245 S630 228 670 238 S740 216 790 231 S870 207 910 218 S985 194 1030 207 S1100 188 1150 199" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-opacity=".9"/>

  <g>
    <line x1="790" y1="148" x2="790" y2="174" stroke="#f4b860" stroke-opacity=".6" stroke-dasharray="3 4"/>
    <circle cx="790" cy="174" r="5" fill="#0b151d" stroke="#f4b860" stroke-width="3"/>
    <rect x="812" y="137" width="160" height="42" rx="8" fill="#172c32" stroke="#f4b860" stroke-opacity=".35"/>
    <text x="826" y="154" fill="#f4b860" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">16:00 · STABLE LIFT</text>
    <text x="826" y="169" fill="#91a39f" font-family="Arial, sans-serif" font-size="10">pressure trend holding</text>
  </g>

  <g fill="#5c716e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <text x="70" y="427">00:00</text><text x="250" y="427">04:00</text><text x="430" y="427">08:00</text><text x="610" y="427">12:00</text><text x="790" y="427">16:00</text><text x="970" y="427">20:00</text><text x="1150" y="427">NOW</text>
  </g>
  <text x="50" y="469" fill="#5c716e" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.1">SAMPLE PAYLOAD · PRESSURE 84.6 BAR · TEMPERATURE 72 °C · FLOW 128 M³/H · WATER CUT 18%</text>
</svg>
