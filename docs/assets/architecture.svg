<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Oil Data Back architecture map</title>
  <desc id="desc">A flow from telemetry source to FastAPI, validation, async data storage, and the visual insight layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12242b"/>
      <stop offset="1" stop-color="#0b151d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#d88942"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3c0"/>
      <stop offset="1" stop-color="#5da9b8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a6d6cc" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#f4b860"/>
    </marker>
    <marker id="arrow-aqua" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#7dd3c0"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="url(#grid)" stroke="#a6d6cc" stroke-opacity=".2"/>
  <circle cx="1130" cy="-35" r="230" fill="none" stroke="#7dd3c0" stroke-opacity=".08"/>
  <circle cx="1130" cy="-35" r="180" fill="none" stroke="#7dd3c0" stroke-opacity=".07"/>

  <text x="52" y="48" fill="#f4b860" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">SYSTEM SHAPE / 03</text>
  <text x="52" y="84" fill="#e8f0eb" font-family="Georgia, serif" font-size="30">One signal. Four readable boundaries.</text>
  <text x="1148" y="49" text-anchor="end" fill="#91a39f" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.3">OIL.DATA / FOUNDATION</text>

  <g stroke-linecap="round" fill="none">
    <path d="M226 220H268" stroke="url(#amber)" stroke-width="2" marker-end="url(#arrow-amber)" filter="url(#glow)"/>
    <path d="M452 220H494" stroke="url(#amber)" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <path d="M678 220H720" stroke="url(#aqua)" stroke-width="2" marker-end="url(#arrow-aqua)"/>
    <path d="M904 220H946" stroke="url(#aqua)" stroke-width="2" marker-end="url(#arrow-aqua)"/>
  </g>
  <g fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    <text x="247" y="202">INGEST</text><text x="473" y="202">NORMALIZE</text><text x="699" y="202">PERSIST</text><text x="925" y="202">EXPLAIN</text>
  </g>

  <g>
    <rect x="52" y="154" width="174" height="132" rx="12" fill="#172c32" stroke="#f4b860" stroke-opacity=".48"/>
    <rect x="66" y="168" width="28" height="22" rx="6" fill="#f4b860" fill-opacity=".14"/>
    <text x="80" y="184" text-anchor="middle" fill="#f4b860" font-family="Georgia, serif" font-size="13">01</text>
    <text x="199" y="184" text-anchor="end" fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">SOURCE</text>
    <path d="M75 236c11-24 17 24 28 0s17 24 28 0 17 24 28 0 17 24 28 0" stroke="#f4b860" stroke-width="2" fill="none"/>
    <text x="66" y="262" fill="#e8f0eb" font-family="Georgia, serif" font-size="19">Telemetry</text>
    <text x="66" y="278" fill="#91a39f" font-family="Arial, sans-serif" font-size="10">raw field readings</text>
  </g>

  <g>
    <rect x="278" y="154" width="174" height="132" rx="12" fill="#172c32" stroke="#f4b860" stroke-opacity=".7"/>
    <rect x="292" y="168" width="28" height="22" rx="6" fill="#f4b860" fill-opacity=".14"/>
    <text x="306" y="184" text-anchor="middle" fill="#f4b860" font-family="Georgia, serif" font-size="13">02</text>
    <text x="425" y="184" text-anchor="end" fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">EDGE</text>
    <path d="M300 228h36m-36 10h22m-22 10h30" stroke="#f4b860" stroke-width="2" stroke-linecap="round"/>
    <text x="292" y="262" fill="#e8f0eb" font-family="Georgia, serif" font-size="19">FastAPI</text>
    <text x="292" y="278" fill="#91a39f" font-family="Arial, sans-serif" font-size="10">versioned HTTP boundary</text>
  </g>

  <g>
    <rect x="504" y="154" width="174" height="132" rx="12" fill="#172c32" stroke="#f4b860" stroke-opacity=".48"/>
    <rect x="518" y="168" width="28" height="22" rx="6" fill="#f4b860" fill-opacity=".14"/>
    <text x="532" y="184" text-anchor="middle" fill="#f4b860" font-family="Georgia, serif" font-size="13">03</text>
    <text x="651" y="184" text-anchor="end" fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">CONTRACT</text>
    <path d="M532 224l8 8 16-19m-24 28l8 8 16-19" stroke="#7dd3c0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="518" y="262" fill="#e8f0eb" font-family="Georgia, serif" font-size="19">Validation</text>
    <text x="518" y="278" fill="#91a39f" font-family="Arial, sans-serif" font-size="10">clear data shapes</text>
  </g>

  <g>
    <rect x="730" y="154" width="174" height="132" rx="12" fill="#172c32" stroke="#7dd3c0" stroke-opacity=".56"/>
    <rect x="744" y="168" width="28" height="22" rx="6" fill="#7dd3c0" fill-opacity=".13"/>
    <text x="758" y="184" text-anchor="middle" fill="#7dd3c0" font-family="Georgia, serif" font-size="13">04</text>
    <text x="877" y="184" text-anchor="end" fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">PERSIST</text>
    <ellipse cx="778" cy="230" rx="17" ry="7" fill="none" stroke="#7dd3c0" stroke-width="2"/>
    <path d="M761 230v19c0 4 8 7 17 7s17-3 17-7v-19m-34 9c0 4 8 7 17 7s17-3 17-7" fill="none" stroke="#7dd3c0" stroke-width="2"/>
    <text x="744" y="262" fill="#e8f0eb" font-family="Georgia, serif" font-size="19">Data layer</text>
    <text x="744" y="278" fill="#91a39f" font-family="Arial, sans-serif" font-size="10">async SQLAlchemy + Postgres</text>
  </g>

  <g>
    <rect x="956" y="154" width="192" height="132" rx="12" fill="#172c32" stroke="#7dd3c0" stroke-opacity=".8"/>
    <rect x="970" y="168" width="28" height="22" rx="6" fill="#7dd3c0" fill-opacity=".13"/>
    <text x="984" y="184" text-anchor="middle" fill="#7dd3c0" font-family="Georgia, serif" font-size="13">05</text>
    <text x="1121" y="184" text-anchor="end" fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">INSIGHT</text>
    <path d="M974 250l13-18 12 7 14-26 15 12 15-21" fill="none" stroke="#7dd3c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="970" y="262" fill="#e8f0eb" font-family="Georgia, serif" font-size="19">Visual lab</text>
    <text x="970" y="278" fill="#91a39f" font-family="Arial, sans-serif" font-size="10">readable data products</text>
  </g>

  <line x1="52" y1="343" x2="1148" y2="343" stroke="#a6d6cc" stroke-opacity=".14"/>
  <text x="52" y="377" fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">CURRENT REPO</text>
  <text x="52" y="400" fill="#e8f0eb" font-family="Arial, sans-serif" font-size="12">app/ · alembic/ · tests/ · docs/</text>
  <text x="1148" y="377" text-anchor="end" fill="#5c716e" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">NEXT SLICE</text>
  <text x="1148" y="400" text-anchor="end" fill="#f4b860" font-family="Arial, sans-serif" font-size="12">TelemetryReading → ingest API → read API</text>
</svg>
